
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Planning Task</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="#" class="banner">My Planning Task</a>
        <button type="button" id="btnNuevaTarea-Newtask" class="btn">
            Nueva Tarea
        </button>
    </header>

    <main class="container-fluid">
        <section class="titulo-principal">
            <h1>Mis Tareas</h1>
            <p>Este es tu organizador de tareas</p>
        </section>


        <section class="task-board-tablero">
            <div class="columna">
                <div class="columna-encabezado">
                    <h2>PENDIENTE</h2>
                    <span class="cantidad-task" id="cantidadHacer">0</span>
                </div>
                <div id="tareasHacer" class="lista-tareas"></div>
            </div>


            <div class="columna">
                <div class="columna-encabezado">
                    <h2>EN PROGRESO</h2>
                    <span class="cantidad-task" id="cantidadProceso">0</span>
                </div>
                <div id="tareasProceso" class="lista-tareas"></div>
            </div>


            <div class="columna">
                <div class="columna-encabezado">
                    <h2>REVISIÓN</h2>
                    <span class="cantidad-task" id="cantidadRevision">0</span>
                </div>
                <div id="tareasRevision" class="lista-tareas"></div>
            </div>


            <div class="columna">
                <div class="columna-encabezado">
                    <h2>HECHO</h2>
                    <span class="cantidad-task" id="cantidadHechas">0</span>
                </div>
                <div id="tareasHechas" class="lista-tareas"></div>
            </div>

        </section>
    </main>


    <dialog id="contenedorform">
        <div class="encabezado-formNuevaTarea">
            <h2>Nueva Tarea</h2>
            <button type="button" id="btncierraform" class="btn btn-cerrar">
                Cerrar
            </button>
        </div>

        <form id="form-tareas">

            <div class="camposForm">
                <label for="task-name">Nombre de la tarea</label>
                <input
                    type="text"
                    id="task-name"
                    class="form-control"
                    required
                >
            </div>

            <div class="camposForm">
                <label for="task-Description">Descripción</label>
                <textarea
                    id="task-Description"
                    name="descripcion"
                    class="form-control"
                    rows="3"
                    required
                ></textarea>
            </div>

            <div class="camposForm">
                <label for="task-assignment">Asignado a</label>
                <input
                    type="text"
                    id="task-assignment"
                    class="form-control"
                    required
                >
            </div>

            <div class="camposForm">
                <label for="task-date">Fecha de entrega</label>
                <input
                    type="date"
                    id="task-date"
                    name="fechaDeEntrega"
                    class="form-control"
                    required
                >
            </div>

            <div class="camposForm">
                <label for="task-status">Estado</label>
                <select
                    id="task-status"
                    class="form-select"
                    required 
                >
                    <option value="">Selecciona un estado</option>
                    <option value="pendiente">PENDIENTE</option>
                    <option value="proceso">EN PROGRESO</option>
                    <option value="revision">REVISIÓN</option>
                    <option value="hecho">HECHO</option>
                </select>
            </div>

            <div class="camposForm">
                <button type="submit" id="btnGuardarTarea" class="btn">
                    Guardar tarea
                </button>
            </div>

        </form>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
